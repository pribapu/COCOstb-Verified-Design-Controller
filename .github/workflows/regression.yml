name: SPI Master Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  icarus:
    name: Icarus (DATA_WIDTH=${{ matrix.data_width }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        data_width: [8, 16]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install cocotb
        run: pip install cocotb

      - name: Run regression
        working-directory: tb
        run: make DATA_WIDTH=${{ matrix.data_width }}

  icarus-apb:
    name: Icarus (APB wrapper)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Install cocotb
        run: pip install cocotb

      - name: Run APB regression
        working-directory: tb
        run: make apb

  verilator-coverage:
    name: Verilator (both widths) + coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install cocotb + verilator
        run: pip install cocotb verilator

      - name: Expose 'verilator' on PATH
        # The verilator PyPI wheel only registers a 'verilator-cli' console
        # script; cocotb's runner does shutil.which("verilator") directly and
        # doesn't know about that wrapper. Symlinking straight to verilator-cli
        # would recurse forever: verilator-cli's own verilator() also does
        # shutil.which("verilator") to find the *real* binary, so a
        # self-referential 'verilator' would just call itself. Point the
        # symlink at the actual bundled perl-wrapper script instead.
        run: |
          VBIN="$(python -c "import verilator, os; print(os.path.join(os.path.dirname(verilator.__file__), 'bin', 'verilator'))")"
          test -f "$VBIN"
          mkdir -p "$RUNNER_TEMP/verilator-shim"
          ln -s "$VBIN" "$RUNNER_TEMP/verilator-shim/verilator"
          echo "$RUNNER_TEMP/verilator-shim" >> "$GITHUB_PATH"

      - name: Verify verilator
        run: verilator --version

      - name: Run regression + coverage gate
        working-directory: tb
        env:
          SIM: verilator
        run: python3 runner.py
